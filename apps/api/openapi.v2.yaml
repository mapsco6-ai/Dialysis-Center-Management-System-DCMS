      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data: {}
                  meta:
                    type: object
                    additionalProperties: true
                    description: >-
                      Pagination and collection metadata (total, page, limit,
                      aggregates) when provided by the resource.
      security:
        - bearer: []
      tags:
        - Flow
      x-any-permissions:
        - scheduling.manage
        - attendance.checkin
        - dialysis.session.view
        - nursing.ward.view
      x-v1-equivalent: GET /api/v1/flow/today
info:
  title: DCMS API v2
  description: >-
    Dialysis Center Management System - REST API covering all 16 project phases
    (docs/PROJECT-PHASES-PLAN.md). Every protected route requires the bearer JWT
    returned by POST /auth/login, and every request is re-checked against the
    caller's current permissions - nothing here is cached from login time.

    Successful JSON responses use { data, meta? }. Paged collections place rows
    in data and pagination/aggregates in meta. Errors, empty responses and file
    downloads are unchanged.
  version: '2.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword
    CreateUserDto:
      type: object
      properties:
        employeeNo:
          type: string
        phone:
          type: string
        email:
          type: string
        jobTitle:
          type: string
        specialty:
          type: string
        licenseNo:
          type: string
        department:
          type: string
        expiresAt:
          type: string
          description: Account stops working after this instant (external inspectors)
        username:
          type: string
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        roleNames:
          type: array
          items:
            type: string
      required:
        - username
        - password
        - fullName
        - roleNames
    UpdateUserDto:
      type: object
      properties:
        employeeNo:
          type: string
        phone:
          type: string
        email:
          type: string
        jobTitle:
          type: string
        specialty:
          type: string
        licenseNo:
          type: string
        department:
          type: string
        expiresAt:
          type: string
          description: Account stops working after this instant (external inspectors)
        fullName:
          type: string
    SetRolesDto:
      type: object
      properties:
        roleNames:
          type: array
          items:
            type: string
        reason:
          type: string
      required:
        - roleNames
        - reason
    DeactivateUserDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    CreateRoleDto:
      type: object
      properties:
        name:
          type: string
          example: ICU_NURSE
        description:
          type: string
      required:
        - name
    UpdateRolePermissionsDto:
      type: object
      properties:
        permissionKeys:
          type: array
          items:
            type: string
      required:
        - permissionKeys
    CreatePatientDto:
      type: object
      properties:
        fullName:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        dateOfBirth:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        fileNumber:
          type: string
          nullable: true
        dialysisStartDate:
          type: string
          nullable: true
        dryWeight:
          type: number
          nullable: true
          minimum: 1
          maximum: 300
        vascularAccessType:
          type: string
          enum:
            - FISTULA
            - CATHETER
            - GRAFT
          nullable: true
        vascularAccessLocation:
          type: string
          nullable: true
        diagnoses:
          type: string
          nullable: true
        chronicDiseases:
          nullable: true
          type: array
          items:
            type: string
        allergies:
          type: string
          nullable: true
        medicalNotes:
          type: string
          nullable: true
        specialInstructions:
          type: string
          nullable: true
      required:
        - fullName
        - gender
        - dateOfBirth
    UpdatePatientDto:
      type: object
      properties:
        fullName:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        dateOfBirth:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        fileNumber:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - DECEASED
            - TRANSFERRED
            - ON_HOLD
            - TRANSPLANTED
        dialysisStartDate:
          type: string
          nullable: true
        dryWeight:
          type: number
          nullable: true
          minimum: 1
          maximum: 300
        vascularAccessType:
          type: string
          enum:
            - FISTULA
            - CATHETER
            - GRAFT
          nullable: true
        vascularAccessLocation:
          type: string
          nullable: true
        diagnoses:
          type: string
          nullable: true
        chronicDiseases:
          nullable: true
          type: array
          items:
            type: string
        allergies:
          type: string
          nullable: true
        medicalNotes:
          type: string
          nullable: true
        specialInstructions:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
    SetRestrictedDto:
      type: object
      properties:
        restricted:
          type: boolean
        reason:
          type: string
      required:
        - restricted
        - reason
    CreateAccessRecordDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - FISTULA
            - CATHETER
            - GRAFT
        location:
          type: string
        placedAt:
          type: string
        notes:
          type: string
      required:
        - type
        - location
        - placedAt
    UpdateAccessRecordDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - REMOVED
            - FAILED
        removedAt:
          type: string
        reason:
          type: string
      required:
        - status
        - removedAt
        - reason
    CreateAlertDto:
      type: object
      properties:
        severity:
          type: string
          enum:
            - CRITICAL
            - IMPORTANT
            - INFORMATION
        category:
          type: string
        message:
          type: string
      required:
        - severity
        - category
        - message
    ResolveAlertDto:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    DialysisPlanEntryDto:
      type: object
      properties:
        weekday:
          type: string
          enum:
            - SUN
            - MON
            - TUE
            - WED
            - THU
            - FRI
            - SAT
        shiftId:
          type: string
      required:
        - weekday
        - shiftId
    SetDialysisPlanDto:
      type: object
      properties:
        entries:
          minItems: 1
          maxItems: 4
          type: array
          items:
            $ref: '#/components/schemas/DialysisPlanEntryDto'
      required:
        - entries
    RescheduleDto:
      type: object
      properties:
        scheduledDate:
          type: string
          example: '2026-10-05'
        shiftId:
          type: string
          format: uuid
        reason:
          type: string
      required:
        - scheduledDate
        - shiftId
        - reason
    CreateExtraSessionDto:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        scheduledDate:
          type: string
        shiftId:
          type: string
        extraReason:
          type: string
        requestedByDoctorId:
          type: string
          nullable: true
          format: uuid
      required:
        - patientId
        - scheduledDate
        - shiftId
        - extraReason
    CreateEmergencySessionDto:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        scheduledDate:
          type: string
        shiftId:
          type: string
        emergencySourceHospital:
          type: string
          nullable: true
        emergencyReason:
          type: string
      required:
        - patientId
        - scheduledDate
        - shiftId
        - emergencyReason
    CheckInDto:
      type: object
      properties:
        stationId:
          type: string
      required:
        - stationId
    UpdateShiftCapacityDto:
      type: object
      properties:
        nominalCapacity:
          type: integer
          minimum: 0
        reservedCapacity:
          type: integer
          nullable: true
          minimum: 0
        lateThresholdMinutes:
          type: integer
          nullable: true
          minimum: 0
      required:
        - nominalCapacity
    CreateInventoryItemDto:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        barcode:
          type: string
          nullable: true
        minimumStock:
          type: number
          nullable: true
          minimum: 0
        cost:
          type: number
          nullable: true
          minimum: 0
        requiresBatchTracking:
          type: boolean
          nullable: true
      required:
        - name
        - category
        - unit
    AdjustStockDto:
      type: object
      properties:
        quantity:
          type: number
          minimum: 0.01
        direction:
          type: string
          enum:
            - INCREASE
            - DECREASE
        reason:
          type: string
      required:
        - quantity
        - direction
        - reason
    SupplyProfileEntryDto:
      type: object
      properties:
        itemId:
          type: string
        defaultQuantity:
          type: number
          minimum: 0.01
      required:
        - itemId
        - defaultQuantity
    SetSupplyProfileDto:
      type: object
      properties:
        entries:
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/SupplyProfileEntryDto'
      required:
        - entries
    SetSessionOverrideDto:
      type: object
      properties:
        itemId:
          type: string
        overrideQuantity:
          type: number
          minimum: 0.01
        reason:
          type: string
          nullable: true
      required:
        - itemId
        - overrideQuantity
    SubstituteSupplyDto:
      type: object
      properties:
        originalItemId:
          type: string
        substituteItemId:
          type: string
        quantity:
          type: number
          minimum: 0.01
        reason:
          type: string
      required:
        - originalItemId
        - substituteItemId
        - quantity
        - reason
    CreateInventoryBatchDto:
      type: object
      properties:
        locationId:
          type: string
        batchNumber:
          type: string
        quantity:
          type: number
          minimum: 0.01
        expiryDate:
          type: string
      required:
        - locationId
        - batchNumber
        - quantity
        - expiryDate
    CreateStockTransferDto:
      type: object
      properties:
        itemId:
          type: string
        fromLocationId:
          type: string
        toLocationId:
          type: string
        quantity:
          type: number
          minimum: 0.01
        reason:
          type: string
          nullable: true
      required:
        - itemId
        - fromLocationId
        - toLocationId
        - quantity
    RejectStockTransferDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    CreateWardDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateMachineDto:
      type: object
      properties:
        machineCode:
          type: string
        wardId:
          type: string
        serialNumber:
          type: string
          nullable: true
        manufacturer:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        isEmergencyDedicated:
          type: boolean
          nullable: true
        isProtected:
          type: boolean
          nullable: true
      required:
        - machineCode
        - wardId
    UpdateMachineStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - AVAILABLE
            - CLEANING
            - WAITING_CLEANING
            - MAINTENANCE
            - OUT_OF_SERVICE
            - RETIRED
        reason:
          type: string
      required:
        - status
        - reason
    RequestApprovalDto:
      type: object
      properties:
        scheduleId:
          type: string
        machineId:
          type: string
        reason:
          type: string
      required:
        - scheduleId
        - machineId
        - reason
    DecideApprovalDto:
      type: object
      properties:
        decision:
          type: string
          enum:
            - APPROVED
            - REJECTED
        reason:
          type: string
          nullable: true
      required:
        - decision
    AssignMachineDto:
      type: object
      properties:
        machineId:
          type: string
          nullable: true
        reason:
          type: string
    PreDialysisDto:
      type: object
      properties:
        weight:
          type: number
          minimum: 1
          maximum: 300
        bp:
          type: string
          pattern: ^\d{2,3}\/\d{2,3}$
        pulse:
          type: integer
          minimum: 1
          maximum: 300
        temperature:
          type: number
          nullable: true
          minimum: 30
          maximum: 45
        glucose:
          type: number
          nullable: true
          minimum: 0
        dryWeight:
          type: number
          nullable: true
          minimum: 1
          maximum: 300
        notes:
          type: string
          nullable: true
      required:
        - weight
        - bp
        - pulse
    StartDialysisDto:
      type: object
      properties:
        nurseId:
          type: string
          nullable: true
        dialyzerType:
          type: string
        bloodLineType:
          type: string
        prescribedDurationMinutes:
          type: integer
          minimum: 1
          maximum: 600
        requiredUF:
          type: number
          minimum: 0
        accessInfo:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - dialyzerType
        - bloodLineType
        - prescribedDurationMinutes
        - requiredUF
    EndDialysisDto:
      type: object
      properties:
        postWeight:
          type: number
          minimum: 1
          maximum: 300
        postBP:
          type: string
          pattern: ^\d{2,3}\/\d{2,3}$
        postPulse:
          type: integer
          minimum: 1
          maximum: 300
        actualUF:
          type: number
          minimum: 0
        complications:
          type: string
          nullable: true
        finalNote:
          type: string
          nullable: true
      required:
        - postWeight
        - postBP
        - postPulse
        - actualUF
    InterruptSessionDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    ReassignMachineDto:
      type: object
      properties:
        newMachineId:
          type: string
        reason:
          type: string
      required:
        - newMachineId
        - reason
    CreateReadingDto:
      type: object
      properties:
        time:
          type: string
          nullable: true
        bp:
          type: string
          pattern: ^\d{2,3}\/\d{2,3}$
        pulse:
          type: integer
          minimum: 1
        arterialPressure:
          type: number
          nullable: true
        venousPressure:
          type: number
          nullable: true
        tmp:
          type: number
          nullable: true
        bloodFlow:
          type: number
          nullable: true
          minimum: 0
        uf:
          type: number
          nullable: true
          minimum: 0
        verifiedActorToken:
          type: string
          nullable: true
      required:
        - bp
        - pulse
    AmendReadingDto:
      type: object
      properties:
        time:
          type: string
          nullable: true
        bp:
          type: string
          pattern: ^\d{2,3}\/\d{2,3}$
        pulse:
          type: integer
          minimum: 1
        arterialPressure:
          type: number
          nullable: true
        venousPressure:
          type: number
          nullable: true
        tmp:
          type: number
          nullable: true
        bloodFlow:
          type: number
          nullable: true
          minimum: 0
        uf:
          type: number
          nullable: true
          minimum: 0
        verifiedActorToken:
          type: string
          nullable: true
        reason:
          type: string
      required:
        - bp
        - pulse
        - reason
    CreateEventDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - NORMAL
            - HYPOTENSION
            - ACCESS_ISSUE
            - MACHINE_ISSUE
            - MEDICATION_GIVEN
            - PHYSICIAN_CALLED
            - SESSION_INTERRUPTED
            - CRAMPS
            - BLEEDING
            - CHEST_PAIN
            - CLOTTING
            - OTHER
        note:
          type: string
          nullable: true
        verifiedActorToken:
          type: string
          nullable: true
      required:
        - type
    CreateAssignmentDto:
      type: object
      properties:
        wardId:
          type: string
        shiftId:
          type: string
        date:
          type: string
        nurseId:
          type: string
        patientIds:
          type: array
          items:
            type: string
      required:
        - wardId
        - shiftId
        - date
        - nurseId
        - patientIds
    SetPinDto:
      type: object
      properties:
        pin:
          type: string
          pattern: ^\d{4,6}$
      required:
        - pin
    VerifyPinDto:
      type: object
      properties:
        username:
          type: string
        pin:
          type: string
          pattern: ^\d{4,6}$
      required:
        - username
        - pin
    CreateDoctorOrderDto:
      type: object
      properties:
        patientId:
          type: string
        type:
          type: string
          enum:
            - MEDICATION
            - LAB_REQUEST
            - NURSING_INSTRUCTION
            - DRY_WEIGHT_CHANGE
            - EXTRA_SESSION_REQUEST
            - PHARMACY_RECOMMENDATION
        payload:
          type: object
          additionalProperties: true
          description: >-
            Fields depend on type. MEDICATION: medicationName, dose, frequency.
            DRY_WEIGHT_CHANGE: numeric newDryWeight. NURSING_INSTRUCTION:
            instruction. LAB_REQUEST: details plus labTestIds and/or labPanelId;
            requires lab.request permission. Other request types: details.
        reason:
          type: string
          nullable: true
      required:
        - patientId
        - type
        - payload
    StopDoctorOrderDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    ModifyDoctorOrderDto:
      type: object
      properties:
        reason:
          type: string
        payload:
          type: object
          additionalProperties: true
      required:
        - reason
        - payload
    AdministerMedicationDto:
      type: object
      properties:
        doseGiven:
          type: string
        sessionId:
          type: string
          nullable: true
      required:
        - doseGiven
    CreateClinicalNoteDto:
      type: object
      properties:
        text:
          type: string
        sessionId:
          type: string
          nullable: true
      required:
        - text
    CreateLabTestDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        unit:
          type: string
          nullable: true
        referenceRangeLow:
          type: number
          nullable: true
        referenceRangeHigh:
          type: number
          nullable: true
        consumableItemId:
          type: string
          nullable: true
        consumableQuantity:
          type: number
          nullable: true
      required:
        - code
        - name
    CreateLabPanelDto:
      type: object
      properties:
        name:
          type: string
        labTestIds:
          minItems: 1
          type: array
          items:
            type: string
      required:
        - name
        - labTestIds
    CreateLabOrderDto:
      type: object
      properties:
        patientId:
          type: string
        labPanelId:
          type: string
          nullable: true
        labTestIds:
          nullable: true
          type: array
          items:
            type: string
        reason:
          type: string
          nullable: true
        linkedSessionId:
          type: string
          nullable: true
      required:
        - patientId
    UpdateItemStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - SAMPLE_COLLECTED
            - PROCESSING
            - SAMPLE_REJECTED
        reason:
          type: string
          description: Required when status is SAMPLE_REJECTED
      required:
        - status
    EnterResultDto:
      type: object
      properties:
        value:
          type: string
        flagCritical:
          type: boolean
          nullable: true
        alertMessage:
          type: string
          nullable: true
      required:
        - value
    AmendResultDto:
      type: object
      properties:
        value:
          type: string
        reason:
          type: string
      required:
        - value
        - reason
    TransferToPharmacyDto:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: number
          minimum: 0.01
        reason:
          type: string
          nullable: true
      required:
        - itemId
        - quantity
    RejectPrescriptionDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    DispensePrescriptionDto:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: number
          minimum: 0.01
        linkedSessionId:
          type: string
          nullable: true
      required:
        - itemId
        - quantity
    ReportFaultDto:
      type: object
      properties:
        machineId:
          type: string
        problem:
          type: string
        severity:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
      required:
        - machineId
        - problem
        - severity
    AssignTicketDto:
      type: object
      properties:
        assignedToId:
          type: string
      required:
        - assignedToId
    UpdateTicketStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - IN_PROGRESS
            - WAITING_PART
            - COMPLETED
        reason:
          type: string
          nullable: true
      required:
        - status
    CancelTicketDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    CloseTicketDto:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    CreateIncidentDto:
      type: object
      properties:
        patientId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        machineId:
          type: string
          nullable: true
        type:
          type: string
          enum:
            - ADVERSE_EVENT
            - INFECTION
            - VASCULAR_ACCESS_EVENT
            - HOSPITAL_TRANSFER
            - EMERGENCY_EVENT
            - REPEATED_HYPOTENSION
            - MACHINE_INCIDENT
        severity:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        description:
          type: string
      required:
        - type
        - severity
        - description
    UpdateIncidentStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - UNDER_REVIEW
            - ACTION_REQUIRED
            - ACTION_DONE
            - CLOSED
        reason:
          type: string
          nullable: true
      required:
        - status
    CreateStaffEntryDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - ACTION_NOTE
            - SHIFT_REPORT
            - PROBLEM
            - COMPLAINT
            - SUGGESTION
        title:
          type: string
        body:
          type: string
        category:
          type: string
          description: equipment, patient, colleague, stock, environment...
        severity:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        shiftId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        machineId:
          type: string
          format: uuid
        complaintSource:
          type: string
          enum:
            - STAFF
            - PATIENT
            - FAMILY
          description: Only meaningful for COMPLAINT
        isConfidential:
          type: boolean
          description: Hide from everyone except the author and reviewers
      required:
        - type
        - title
        - body
    UpdateStaffEntryStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - SUBMITTED
            - ACKNOWLEDGED
            - IN_PROGRESS
            - RESOLVED
            - CLOSED
            - REJECTED
        reason:
          type: string
          description: Required when rejecting
        response:
          type: string
          description: Management reply, visible to the author
      required:
        - status
    AssignStaffEntryDto:
      type: object
      properties:
        assignedToId:
          type: string
          format: uuid
      required:
        - assignedToId
    EscalateStaffEntryDto:
      type: object
      properties:
        incidentType:
          type: string
          enum:
            - ADVERSE_EVENT
            - INFECTION
            - VASCULAR_ACCESS_EVENT
            - HOSPITAL_TRANSFER
            - EMERGENCY_EVENT
            - REPEATED_HYPOTENSION
            - MACHINE_INCIDENT
      required:
        - incidentType
    SetSettingDto:
      type: object
      properties:
        value:
          type: object
          description: boolean or integer, depending on the setting
      required:
