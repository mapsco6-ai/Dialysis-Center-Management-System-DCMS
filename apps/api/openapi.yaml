        password:
          type: string
          minLength: 8
        fullName:
          type: string
        roleNames:
          type: array
          items:
            type: string
      required:
        - username
        - password
        - fullName
        - roleNames
    DeactivateUserDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    UpdateRolePermissionsDto:
      type: object
      properties:
