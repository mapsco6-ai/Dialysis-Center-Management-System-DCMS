        reason:
          type: string
      required:
        - newMachineId
        - reason
    CreateReadingDto:
      type: object
      properties:
        time:
          type: string
          nullable: true
        bp:
          type: string
          pattern: ^\d{2,3}\/\d{2,3}$
        pulse:
          type: integer
          minimum: 1
        arterialPressure:
          type: number
          nullable: true
        venousPressure:
          type: number
          nullable: true
        tmp:
          type: number
          nullable: true
        bloodFlow:
          type: number
          nullable: true
          minimum: 0
        uf:
          type: number
          nullable: true
          minimum: 0
        verifiedActorToken:
          type: string
          nullable: true
      required:
        - bp
        - pulse
    AmendReadingDto:
      type: object
      properties:
        time:
          type: string
          nullable: true
        bp:
          type: string
          pattern: ^\d{2,3}\/\d{2,3}$
        pulse:
          type: integer
          minimum: 1
        arterialPressure:
          type: number
          nullable: true
        venousPressure:
          type: number
          nullable: true
        tmp:
          type: number
          nullable: true
        bloodFlow:
          type: number
          nullable: true
          minimum: 0
        uf:
          type: number
          nullable: true
          minimum: 0
        verifiedActorToken:
          type: string
          nullable: true
        reason:
          type: string
      required:
        - bp
        - pulse
        - reason
    CreateEventDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - NORMAL
            - HYPOTENSION
            - ACCESS_ISSUE
            - MACHINE_ISSUE
            - MEDICATION_GIVEN
            - PHYSICIAN_CALLED
            - SESSION_INTERRUPTED
            - OTHER
        note:
          type: string
          nullable: true
        verifiedActorToken:
          type: string
          nullable: true
      required:
        - type
