          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        fileNumber:
          type: string
          nullable: true
        dialysisStartDate:
          type: string
          nullable: true
        dryWeight:
          type: number
          nullable: true
          minimum: 1
          maximum: 300
        vascularAccessType:
          type: string
          enum:
            - FISTULA
            - CATHETER
            - GRAFT
          nullable: true
        vascularAccessLocation:
          type: string
          nullable: true
        diagnoses:
          type: string
          nullable: true
        chronicDiseases:
          nullable: true
          type: array
          items:
            type: string
        allergies:
          type: string
          nullable: true
        medicalNotes:
          type: string
          nullable: true
        specialInstructions:
          type: string
          nullable: true
      required:
        - fullName
        - gender
        - dateOfBirth
    UpdatePatientDto:
      type: object
      properties:
        fullName:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        dateOfBirth:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        fileNumber:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - DECEASED
            - TRANSFERRED
        dialysisStartDate:
          type: string
          nullable: true
        dryWeight:
          type: number
          nullable: true
          minimum: 1
          maximum: 300
        vascularAccessType:
          type: string
          enum:
            - FISTULA
            - CATHETER
            - GRAFT
          nullable: true
        vascularAccessLocation:
          type: string
          nullable: true
        diagnoses:
          type: string
          nullable: true
        chronicDiseases:
          nullable: true
          type: array
          items:
            type: string
        allergies:
          type: string
          nullable: true
        medicalNotes:
          type: string
          nullable: true
        specialInstructions:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
    CreateAlertDto:
      type: object
      properties:
        severity:
          type: string
          enum:
            - CRITICAL
            - IMPORTANT
            - INFORMATION
        category:
          type: string
        message:
          type: string
      required:
        - severity
        - category
        - message
    ResolveAlertDto:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    DialysisPlanEntryDto:
      type: object
      properties:
        weekday:
          type: string
          enum:
            - SUN
            - MON
            - TUE
            - WED
            - THU
            - FRI
            - SAT
        shiftId:
          type: string
      required:
        - weekday
        - shiftId
    SetDialysisPlanDto:
      type: object
      properties:
        entries:
          minItems: 1
          maxItems: 4
          type: array
          items:
            $ref: '#/components/schemas/DialysisPlanEntryDto'
      required:
        - entries
    CreateExtraSessionDto:
      type: object
      properties:
