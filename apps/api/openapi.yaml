        reason:
          type: string
      required:
        - scheduleId
        - machineId
        - reason
    DecideApprovalDto:
      type: object
      properties:
        decision:
          type: string
          enum:
            - APPROVED
            - REJECTED
        reason:
          type: string
          nullable: true
      required:
        - decision
    AssignMachineDto:
      type: object
      properties:
        machineId:
          type: string
          nullable: true
        reason:
          type: string
    PreDialysisDto:
      type: object
      properties:
        weight:
          type: number
          minimum: 1
          maximum: 300
        bp:
          type: string
          pattern: ^\d{2,3}\/\d{2,3}$
        pulse:
          type: integer
          minimum: 1
          maximum: 300
        temperature:
          type: number
          nullable: true
          minimum: 30
          maximum: 45
        glucose:
          type: number
          nullable: true
          minimum: 0
        dryWeight:
          type: number
          nullable: true
          minimum: 1
          maximum: 300
        notes:
          type: string
          nullable: true
      required:
        - weight
        - bp
        - pulse
    StartDialysisDto:
      type: object
      properties:
        nurseId:
          type: string
          nullable: true
        dialyzerType:
          type: string
        bloodLineType:
          type: string
        prescribedDurationMinutes:
          type: integer
          minimum: 1
          maximum: 600
        requiredUF:
          type: number
          minimum: 0
        accessInfo:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - dialyzerType
        - bloodLineType
        - prescribedDurationMinutes
        - requiredUF
    EndDialysisDto:
      type: object
      properties:
        postWeight:
          type: number
          minimum: 1
          maximum: 300
        postBP:
          type: string
          pattern: ^\d{2,3}\/\d{2,3}$
        postPulse:
          type: integer
          minimum: 1
          maximum: 300
        actualUF:
          type: number
          minimum: 0
        complications:
          type: string
          nullable: true
        finalNote:
          type: string
          nullable: true
      required:
        - postWeight
        - postBP
        - postPulse
        - actualUF
