      type: object
      properties:
        wardId:
          type: string
        shiftId:
          type: string
        date:
          type: string
        nurseId:
          type: string
        patientIds:
          type: array
          items:
            type: string
      required:
        - wardId
        - shiftId
        - date
        - nurseId
        - patientIds
    SetPinDto:
      type: object
      properties:
        pin:
          type: string
          pattern: ^\d{4,6}$
      required:
        - pin
    VerifyPinDto:
      type: object
      properties:
        username:
          type: string
        pin:
          type: string
          pattern: ^\d{4,6}$
      required:
        - username
        - pin
    CreateDoctorOrderDto:
      type: object
      properties:
        patientId:
          type: string
        type:
          type: string
          enum:
            - MEDICATION
            - LAB_REQUEST
            - NURSING_INSTRUCTION
            - DRY_WEIGHT_CHANGE
            - EXTRA_SESSION_REQUEST
            - PHARMACY_RECOMMENDATION
        payload:
          type: object
          additionalProperties: true
          description: >-
            Fields depend on type. MEDICATION: medicationName, dose, frequency.
            DRY_WEIGHT_CHANGE: numeric newDryWeight. NURSING_INSTRUCTION:
            instruction. LAB_REQUEST: details plus labTestIds and/or labPanelId;
            requires lab.request permission. Other request types: details.
        reason:
          type: string
          nullable: true
      required:
        - patientId
        - type
        - payload
    StopDoctorOrderDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    ModifyDoctorOrderDto:
      type: object
      properties:
        reason:
          type: string
        payload:
          type: object
          additionalProperties: true
      required:
        - reason
        - payload
    AdministerMedicationDto:
      type: object
      properties:
        doseGiven:
          type: string
        sessionId:
          type: string
          nullable: true
      required:
        - doseGiven
