        referenceRangeHigh:
          type: number
          nullable: true
        consumableItemId:
          type: string
          nullable: true
        consumableQuantity:
          type: number
          nullable: true
      required:
        - code
        - name
    CreateLabPanelDto:
      type: object
      properties:
        name:
          type: string
        labTestIds:
          minItems: 1
          type: array
          items:
            type: string
      required:
        - name
        - labTestIds
    CreateLabOrderDto:
      type: object
      properties:
        patientId:
          type: string
        labPanelId:
          type: string
          nullable: true
        labTestIds:
          nullable: true
          type: array
          items:
            type: string
        reason:
          type: string
          nullable: true
        linkedSessionId:
          type: string
          nullable: true
      required:
        - patientId
    UpdateItemStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - SAMPLE_COLLECTED
            - PROCESSING
      required:
        - status
    EnterResultDto:
      type: object
      properties:
        value:
          type: string
        flagCritical:
          type: boolean
          nullable: true
        alertMessage:
          type: string
          nullable: true
      required:
        - value
    AmendResultDto:
      type: object
      properties:
        value:
          type: string
        reason:
          type: string
      required:
        - value
        - reason
    TransferToPharmacyDto:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: number
          minimum: 0.01
        reason:
          type: string
          nullable: true
      required:
        - itemId
        - quantity
    DispensePrescriptionDto:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: number
          minimum: 0.01
        linkedSessionId:
          type: string
          nullable: true
      required:
        - itemId
        - quantity
    ReportFaultDto:
      type: object
      properties:
        machineId:
          type: string
        problem:
          type: string
        severity:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
      required:
        - machineId
        - problem
        - severity
    AssignTicketDto:
      type: object
      properties:
        assignedToId:
          type: string
      required:
        - assignedToId
    UpdateTicketStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - IN_PROGRESS
            - WAITING_PART
            - COMPLETED
        reason:
          type: string
          nullable: true
      required:
        - status
    CloseTicketDto:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    CreateIncidentDto:
      type: object
      properties:
        patientId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        machineId:
          type: string
          nullable: true
        type:
          type: string
          enum:
            - ADVERSE_EVENT
            - INFECTION
            - VASCULAR_ACCESS_EVENT
            - HOSPITAL_TRANSFER
            - EMERGENCY_EVENT
            - REPEATED_HYPOTENSION
            - MACHINE_INCIDENT
        severity:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        description:
          type: string
      required:
        - type
        - severity
        - description
    UpdateIncidentStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - UNDER_REVIEW
            - CLOSED
        reason:
          type: string
          nullable: true
      required:
        - status
