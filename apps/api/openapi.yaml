      type: object
      properties:
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        barcode:
          type: string
          nullable: true
        minimumStock:
          type: number
          nullable: true
          minimum: 0
        cost:
          type: number
          nullable: true
          minimum: 0
        requiresBatchTracking:
          type: boolean
          nullable: true
      required:
        - name
        - category
        - unit
    AdjustStockDto:
      type: object
      properties:
        quantity:
          type: number
          minimum: 0.01
        direction:
          type: string
          enum:
            - INCREASE
            - DECREASE
        reason:
          type: string
      required:
        - quantity
        - direction
        - reason
    SupplyProfileEntryDto:
      type: object
      properties:
        itemId:
          type: string
