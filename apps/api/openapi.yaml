      type: object
      properties:
        entries:
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/SupplyProfileEntryDto'
      required:
        - entries
    SetSessionOverrideDto:
      type: object
      properties:
        itemId:
          type: string
        overrideQuantity:
          type: number
          minimum: 0.01
        reason:
          type: string
          nullable: true
      required:
        - itemId
        - overrideQuantity
    SubstituteSupplyDto:
      type: object
      properties:
        originalItemId:
          type: string
        substituteItemId:
          type: string
        quantity:
          type: number
          minimum: 0.01
        reason:
          type: string
      required:
        - originalItemId
        - substituteItemId
        - quantity
        - reason
    CreateInventoryBatchDto:
      type: object
      properties:
        locationId:
          type: string
        batchNumber:
          type: string
        quantity:
          type: number
          minimum: 0.01
        expiryDate:
          type: string
      required:
        - locationId
        - batchNumber
        - quantity
        - expiryDate
    CreateStockTransferDto:
      type: object
      properties:
        itemId:
          type: string
        fromLocationId:
          type: string
        toLocationId:
          type: string
        quantity:
          type: number
          minimum: 0.01
        reason:
          type: string
          nullable: true
      required:
        - itemId
        - fromLocationId
        - toLocationId
        - quantity
    RejectStockTransferDto:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    CreateWardDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateMachineDto:
      type: object
      properties:
        machineCode:
          type: string
        wardId:
          type: string
        serialNumber:
          type: string
          nullable: true
        manufacturer:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        isEmergencyDedicated:
          type: boolean
          nullable: true
        isProtected:
          type: boolean
          nullable: true
      required:
        - machineCode
        - wardId
