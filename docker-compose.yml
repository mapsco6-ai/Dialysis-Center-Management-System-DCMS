# Requires a .env file next to this one - copy .env.example to .env and fill
# in real secrets first (docker compose reads .env automatically).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      POSTGRES_DB: dcms
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required, see .env.example}
      TZ: "Asia/Baghdad"
    ports:
      # Bound to localhost only - Postgres is never exposed on the network
      # (docs review DCMS-002). Use `docker compose exec postgres psql ...`
      # for local admin access, or an SSH tunnel for remote access.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - dcms_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms -d dcms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required, see .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required, see .env.example}
    ports:
      # Bound to localhost only, same reasoning as Postgres (docs review
      # DCMS-002) - fault-report attachments are never exposed directly on
      # the network; the API's own /maintenance/tickets/:id/attachment
      # route is the only path a client ever fetches one through.
      - "127.0.0.1:${MINIO_HOST_PORT:-19000}:9000"
    volumes:
      - dcms_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Owner connection - used only by Prisma CLI (migrate/seed/harden) at
      # container startup, never by the running server (see prisma.service.ts).
      DATABASE_URL: "postgresql://dcms:${POSTGRES_PASSWORD:?}@postgres:5432/dcms?schema=public"
      # Restricted connection - what the running server actually uses.
      APP_DATABASE_URL: "postgresql://dcms_app:${APP_DB_PASSWORD:?}@postgres:5432/dcms?schema=public"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
      JWT_EXPIRES_IN: "8h"
      PORT: "3001"
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required, see .env.example}
      # "Today" for scheduling is the center's local calendar day, not UTC's -
      # this must match wherever the center actually operates (see
      # apps/api/src/scheduling/date.util.ts).
      TZ: "Asia/Baghdad"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET: "dcms-maintenance"
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  dcms_postgres_data:
  dcms_minio_data:
